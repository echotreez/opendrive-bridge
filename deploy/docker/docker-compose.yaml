# A working starting point for running the bridge in a container (§8.3).
#
# The container takes the same two files as a host install. There is no
# container-specific credential backend any more:
#
#   cp ../../.env.example .env     # then fill in your OpenDrive credentials
#   mkdir -p cache && sudo chown 65532:65532 cache   # see "the cache" below
#   docker compose up -d
#
# The first start rewrites .env encrypted and creates .env.key beside it, then
# prints nothing further about credentials — the same first run as on a laptop.
#
# Two things to keep safe, and keep together: .env and .env.key. Either one on
# its own is useless.
#
# ---------------------------------------------------------------------------
# READ THIS BEFORE CHANGING THE VOLUMES — the cache (§8.3.1)
#
# With the caching gateway in write-back mode the bridge answers a write as soon as
# the bytes are on its disk and in its journal — before OpenDrive has them. For a
# while, that directory is the only place the user's file exists. So it has to
# outlive the container: `docker compose down`, `docker rm`, an image upgrade or an
# orchestrator moving the container are routine, and a cache inside the
# container's own writable layer would go with any of them.
#
# The default below is a directory on the host, bind-mounted in. It is the most
# robust of the options:
#
#   - Docker's own housekeeping cannot touch it. `docker compose down -v` and
#     `docker volume prune` delete named volumes; they leave a host directory
#     alone.
#   - It is visible. The journal and the files waiting to be uploaded are on the
#     host, where they can be inspected, backed up or copied out by hand.
#   - After a crash, starting the container again replays the journal from it and
#     sends whatever had not gone up. Note that an unfinished file is sent again
#     from the beginning rather than resumed mid-way; if it had in fact arrived,
#     OpenDrive recognises it by hash and the resend costs almost nothing.
#
# Two things it needs:
#
#   1. **Ownership.** The image runs as uid 65532, and the directory has to belong
#      to it — hence the `chown` in the setup lines at the top. Skip it and the
#      daemon refuses to start, saying which directory and what to run.
#   2. **One bridge per directory.** The daemon locks the cache directory, so a
#      second container (or a host opendrived) pointed at the same folder refuses
#      to start rather than two of them writing one journal. The lock is a kernel
#      lock and is released when the holder dies, so a crash never leaves it
#      behind. It holds across containers and host processes on one Linux kernel;
#      it is not guaranteed across Docker Desktop's VM boundary or over NFS.
#
# **On Docker Desktop for Mac or Windows,** prefer the named volume line instead
# (commented out below). A bind mount there crosses the VM's file-sharing layer,
# and whether fsync reaches the host disk through it has not been measured —
# the durability contract rests on fsync, so this file does not recommend what
# nobody has checked. A named volume lives on the VM's own disk.
#
# The daemon also checks at startup and reports `durable: false` on
# /v1/cache/status if the cache directory is not a mount at all — but a default
# configuration has to be a safe one, and a check is a second line of defence.
#
# If you would rather keep nothing here that OpenDrive does not already have, set
# ODB_CACHE_WRITE_BACK=false. The gateway becomes a read cache, nothing is ever
# unsent, and the whole question goes away.
# ---------------------------------------------------------------------------
services:
  opendrive-bridge:
    image: ghcr.io/echotreez/opendrive-bridge:latest
    container_name: opendrive-bridge
    restart: unless-stopped

    # Published to loopback on purpose. The container binds 0.0.0.0 because
    # inside a container loopback is unreachable from outside — but that does not
    # mean the port should be open to your network.
    ports:
      - "127.0.0.1:9750:9750"

    environment:
      # Required because the listen address is not loopback: anything that can
      # reach the port could otherwise use the OpenDrive account behind it.
      #
      # On a host install the bridge generates this itself and puts it in .env.
      # Here it is explicit, because a container's .env is often built by
      # something else and this way the value is under your control. Leave it
      # unset and the daemon will refuse to start and say so.
      ODB_API_KEY: ${ODB_API_KEY:?set ODB_API_KEY, e.g. openssl rand -hex 32}
      ODB_LOG_LEVEL: info

      # The caching gateway (§3.5). The directory must match the volume below.
      ODB_CACHE_DIR: /data/cache
      # Write-back: a write is answered as soon as it is on the bridge's disk,
      # and uploaded in the background. Set this to false to write straight
      # through, which is slower for the client and keeps nothing here that
      # OpenDrive does not have.
      ODB_CACHE_WRITE_BACK: "true"

    volumes:
      # .env is mounted WRITABLE, and that is not an oversight. The first run
      # rewrites it encrypted, and every token rotation writes it again. Mounted
      # read-only the bridge would work until the first refresh and then start
      # failing in a way that looks like an OpenDrive outage.
      - ./.env:/data/.env
      # .env.key is only ever read.
      - ./.env.key:/data/.env.key:ro
      # Transfer state: job progress, resume points.
      - odb-state:/data/jobs
      # The cache — see the note at the top of this file. In write-back mode this
      # directory holds data OpenDrive does not have yet, so it must outlive the
      # container.
      #
      # It also holds the user's files in the clear. Unlike .env, nothing here is
      # encrypted: the protection is the 0700 mode the daemon sets and whatever
      # the underlying disk provides.
      - ./cache:/data/cache
      # Docker Desktop (Mac/Windows): use a named volume instead, and add
      # `odb-cache:` under `volumes:` at the bottom.
      # - odb-cache:/data/cache

    # The image has no shell, so this runs the binary. It reports healthy as soon
    # as the daemon answers — including when it is not signed in yet, which is a
    # running daemon rather than a broken one.
    healthcheck:
      test: ["CMD", "/usr/local/bin/odctl", "--addr", "127.0.0.1:9750", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    # Nothing in the image needs to write outside /data, and nothing needs extra
    # privileges.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  odb-state:
  # odb-cache:   # only if you use the named-volume line above
