# opendrive-bridge in a container.
#
#   docker compose up -d
#
# Then open http://127.0.0.1:9750/ui and sign in with your OpenDrive account (or
# run `odctl login you@example.com`). That is all: nothing to create, copy, chown
# or generate first. The bridge encrypts what you type into data/credentials.key
# and stays signed in across restarts. If your OpenDrive password changes, the
# page asks you to sign in again — no restart, no new container.
#
# ./data is created by Docker on the first `up` and holds everything the bridge
# keeps: credentials.key, jobs/ (transfer state) and cache/. Back it up, keep it
# with this file, and do not point two bridges at it (see below).
#
# ---------------------------------------------------------------------------
# The cache (§3.5) is on, in write-back mode: an upload is answered as soon as the
# file is on the bridge's disk, and sent to OpenDrive in the background. For that
# while ./data/cache is the only copy, which is why it lives in ./data and not in
# the container: `docker compose down`, an image upgrade or `docker rm` would take
# it with them otherwise. After a crash, starting the container again sends
# whatever had not gone up. `docker compose exec opendrive-bridge odctl cache
# status` says whether it is safe to stop.
#
# Set ODB_CACHE_WRITE_BACK to "false" to keep nothing here that OpenDrive does not
# already have. The cache directory is not encrypted: its protection is the 0700
# mode the bridge sets and whatever the disk underneath provides.
#
# One bridge per folder: the bridge locks ./data/cache, so a second one on the
# same folder refuses to start — on one Linux kernel. Where each container is its
# own virtual machine (Apple's `container`, possibly Docker Desktop) the lock does
# not reach across, and running one per folder is up to you.
#
# On Docker Desktop, whether fsync crosses into the host through a bind mount has
# not been measured; the cache's guarantees rest on it. Use the named-volume line
# below for the cache there.
# ---------------------------------------------------------------------------
services:
  opendrive-bridge:
    image: ghcr.io/echotreez/opendrive-bridge:latest
    container_name: opendrive-bridge
    restart: unless-stopped

    # Published to this machine only. The container listens on all interfaces
    # because loopback inside a container is unreachable, but that does not mean
    # the port should be open to your network. No API key is required as long as
    # it stays that way; set ODB_API_KEY below if you publish it more widely.
    ports:
      - "127.0.0.1:9750:9750"

    environment:
      ODB_CACHE_DIR: /data/cache
      ODB_CACHE_WRITE_BACK: "true"
      ODB_LOG_LEVEL: info
      # ODB_API_KEY: "choose-a-long-random-string"   # then every caller must send it

    volumes:
      - ./data:/data
      # Docker Desktop: keep the cache on a named volume instead, and uncomment
      # `odb-cache:` at the bottom.
      # - odb-cache:/data/cache

    healthcheck:
      test: ["CMD", "/usr/local/bin/odctl", "--addr", "127.0.0.1:9750", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    # Stopping gives the cache time to finish uploading (§3.5.2 rule 5).
    stop_grace_period: 5m

    # Nothing in the image needs to write outside /data.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

