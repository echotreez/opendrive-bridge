name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -coverprofile=coverage.out ./...
        shell: bash

  # Whitepaper §6.3: pkg/opendrive >= 85%, internal/* >= 75%, each package on its
  # own. CI blocks a PR that drops below the gate.
  coverage:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }
      - run: go test -coverprofile=coverage.out ./...
      - name: Enforce coverage gates
        run: ./scripts/check-coverage.sh coverage.out

  lint:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # gitleaks asks GitHub which commits a pull request contains, which needs
    # pull-requests: read. Without it the step fails with "Resource not
    # accessible by integration" and a 403 — a message that says nothing about
    # credentials, in a step whose only job is to find them. Anyone reading a red
    # gitleaks tick would reasonably assume the worst, so it is worth naming
    # here: this permission is why the step can tell the difference.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # fetch-depth: 0 because gitleaks scans the commit range base^..head, and
      # the default shallow checkout does not contain the base — git answers
      # "ambiguous argument", gitleaks reports "no leaks found in partial scan",
      # and the step fails anyway. A scanner that finds nothing because it looked
      # at nothing is the worst of the three ways this step can go wrong, since
      # the summary line is indistinguishable from a clean result.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }
      - uses: golangci/golangci-lint-action@v8

      # The security scanners run here, on every pull request, and not only in
      # the release workflow. They used to run only there, which meant the
      # earliest a finding could surface was the day someone wanted to ship — and
      # that is exactly how it went: the first execution of release.yml failed on
      # gosec, on code that had been on main for weeks.
      #
      # A gate that only runs when you are trying to release is not a gate, it is
      # an ambush.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      # The exclusions are the ones this project has argued through: MD5 is
      # required by OpenDrive's own upload protocol and never used for security
      # (G401/G501), and the files the daemon opens are the ones its caller asked
      # it to open (G304).
      #
      # Everything else must be either fixed or suppressed at the line with a
      # reason, which is why this fails on medium as well as high: the three
      # deliberate findings in internal/keystore now carry #nosec annotations
      # explaining themselves, so any medium that appears here is a new one.
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec="$(go env GOPATH)/bin/gosec"
          # For the record, everything it can see, including the low findings
          # that do not fail the build.
          "$gosec" -quiet -exclude=G401,G501,G304 -exclude-dir=testdata ./... || true
          echo "--- the gate: medium and above ---"
          "$gosec" -quiet -severity=medium -exclude=G401,G501,G304 -exclude-dir=testdata ./...

      # Also moved forward from the release workflow, and for a sharper reason
      # than the other two: on its first run gitleaks found a real access token
      # in the history — committed by a test written to prove that tokens do not
      # leak. A scanner that only runs at release time would have let the next
      # one sit there just as long. Reviewed findings are recorded, one line each
      # with its reason, in .gitleaksignore, which gitleaks reads itself.
      #
      # Nothing here excludes testdata/fixtures as a directory. Fixtures are
      # recorded from the live API, which makes them the likeliest hiding place
      # for a real credential, so each one is allowlisted individually or not at
      # all.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Transfer performance, against the 1 GB baseline of whitepaper §10.
  #
  # The gate compares a ratio — pipeline ns/op over an MD5 of the same bytes,
  # both measured in this run — rather than MB/s. A hosted runner's throughput
  # varies by more than the 15% tolerance between mornings, so an absolute
  # threshold would fail for reasons unrelated to the code, and a gate that
  # cries wolf gets switched off. scripts/check-bench.sh explains it in full.
  bench:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }
      - name: 1GB upload and download
        run: ./scripts/check-bench.sh

  # Every target compiles. Compiling is necessary and not sufficient, which is
  # what the smoke job below is for.
  crossbuild:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build ./...

  # Prove the binaries run. A cross-compiled binary can build cleanly and then
  # fail on its target for reasons no compiler sees, so each of these starts the
  # real daemon against a mock OpenDrive and drives it with the real odctl.
  #
  # Every supported target now has a runner that executes it natively, which is
  # one of the quieter benefits of dropping Windows (§8.1): there is no longer a
  # combination that is only ever cross-compiled and hoped about.
  #
  # darwin/amd64 is built but not released, and still smoked here because the
  # runner exists. It uses macos-15-intel. It was macos-13, which GitHub retired
  # in December 2025; the job did not fail, it queued for a runner that no longer
  # exists and would have sat there until the run timed out. A green tick on a
  # job that never started is the same class of problem as a 200 that means
  # nothing, so it is worth naming.
  #
  # macos-15-intel is the last x86_64 macOS image GitHub intends to offer, and
  # support for it ends in autumn 2027. When it goes, darwin/amd64 becomes
  # compiled-only unless Apple hardware is available to run it on.
  smoke:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux/amd64 }
          - { os: macos-latest, target: darwin/arm64 }
          - { os: macos-15-intel, target: darwin/amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }
      - name: Build the binaries under test
        shell: bash
        run: |
          mkdir -p smokebin
          go build -o smokebin/ ./cmd/opendrived ./cmd/odctl ./tools/mockupstream
      - name: Smoke ${{ matrix.target }}
        shell: bash
        run: ./scripts/smoke.sh smokebin

  # The systemd unit, installed for real with `systemctl --user`.
  #
  # This job exists because the unit had been wrong for a release and nothing
  # noticed: DynamicUser=yes and ProtectHome=yes both survived the move of
  # credentials into the user's own folder, and either one stops the daemon
  # reading its .env. A unit file is not documentation, it is the thing that
  # runs, and the only way to know it works is to start it.
  systemd-user-unit:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }

      - name: Build and lay out a release directory
        run: |
          set -euo pipefail
          mkdir -p "$HOME/opendrive-bridge"
          go build -o "$HOME/opendrive-bridge/" ./cmd/opendrived ./cmd/odctl ./tools/mockupstream
          cp .env.example "$HOME/opendrive-bridge/.env"
          # A username is enough to exercise the credential path; the mock
          # upstream does not check it.
          printf 'ODB_USERNAME=ci@example.com\nODB_PASSWORD=not-a-real-password\n' \
            > "$HOME/opendrive-bridge/.env"

      - name: Install the unit exactly as the file says to
        run: |
          set -euo pipefail
          dir="$HOME/opendrive-bridge"
          mkdir -p ~/.config/systemd/user
          sed -e "s#/path/to/opendrive-bridge#$dir#g" \
            deploy/systemd/opendrived.service > ~/.config/systemd/user/opendrived.service
          systemd-analyze verify ~/.config/systemd/user/opendrived.service
          systemctl --user daemon-reload

      - name: Start it, and prove it can read its own .env
        run: |
          set -euo pipefail
          dir="$HOME/opendrive-bridge"
          "$dir/mockupstream" --addr 127.0.0.1:9799 --port-file "$dir/upstream.addr" &
          for _ in $(seq 1 50); do [ -s "$dir/upstream.addr" ] && break; sleep 0.2; done
          systemctl --user set-environment ODB_BASE_URL="http://$(cat "$dir/upstream.addr")/api/v1"
          systemctl --user start opendrived
          for _ in $(seq 1 50); do
            "$dir/odctl" status >/dev/null 2>&1 && break
            sleep 0.2
          done
          systemctl --user is-active opendrived
          "$dir/odctl" status

          # The credential file must have been sealed by that first start, and
          # the key created beside it. This is the assertion the whole job is
          # for: ProtectHome or DynamicUser coming back would fail here.
          test -f "$dir/.env.key" || { echo ".env.key was not created"; exit 1; }
          grep -q "Salted__" <(base64 -d < "$dir/.env" 2>/dev/null | head -c 8) \
            || { echo ".env was not encrypted by the first run"; exit 1; }
          ! grep -q "not-a-real-password" "$dir/.env" \
            || { echo "the plaintext password is still in .env"; exit 1; }

      - name: Stop and remove it
        if: always()
        run: |
          systemctl --user stop opendrived || true
          systemctl --user disable opendrived || true
          journalctl --user -u opendrived --no-pager -n 40 || true

  # linux/arm64 has no hosted x86 runner, so it runs under emulation. Slower, but
  # it is the difference between "it compiled" and "it works".
  smoke-linux-arm64:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }
      - uses: docker/setup-qemu-action@v3
        with: { platforms: arm64 }
      - name: Build for linux/arm64
        run: |
          mkdir -p smokebin
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o smokebin/ \
            ./cmd/opendrived ./cmd/odctl ./tools/mockupstream
      - name: Smoke linux/arm64 under emulation
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/work" -w /work \
            debian:stable-slim ./scripts/smoke.sh smokebin

  # The release archives are built on every pull request, not only on a tag, so
  # a packaging mistake is found by the change that caused it.
  package:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --snapshot --clean --skip=publish
      - name: Check what came out
        run: |
          set -euo pipefail
          # Three archives and one checksum file, or the matrix has drifted.
          # This number has now been wrong twice — it said six after v1.1
          # narrowed the matrix to four, and the line below still announced "6
          # archives" after that was fixed. Both in the file whose whole job is
          # to catch exactly this kind of lag. It is asserted and printed from
          # one variable now, so the two cannot disagree again.
          want_archives=3
          archives=$(ls dist/*.tar.gz | wc -l)
          if [ "$archives" -ne "$want_archives" ]; then
            echo "expected $want_archives archives, found $archives:"; ls dist/
            exit 1
          fi
          ls dist/*SHA256SUMS >/dev/null
          # Every archive must contain both programs and the deployment guide:
          # a release that ships a daemon with no way to log in is not usable.
          #
          # The listing is taken once into a file rather than piped into grep.
          # `tar tzf "$a" | grep -q x` looks equivalent and is not: grep exits at
          # the first match, tar then dies writing to a closed pipe, and under
          # `pipefail` the pipeline reports tar's failure. The check announced
          # that the first archive was "missing opendrived" — an accurate status
          # about the wrong thing, which is the mistake this project spends most
          # of its time catching upstream.
          # Unpacking must produce opendrive-bridge/ and nothing loose. This is
          # checked rather than assumed: wrap_in_directory is one line of
          # configuration and the failure it prevents — a tar bomb across the
          # user's current directory — is invisible until somebody unpacks one.
          for a in dist/*.tar.gz; do
            listing="$(mktemp)"
            tar tzf "$a" > "$listing"
            # A release must carry the template and must never carry a real
            # credential file. The second half matters more than it looks: .env
            # and .env.key live in the working directory a release is built
            # from, so a stray one would be picked up by the archive glob and
            # published to everyone.
            for unwanted in .env .env.key; do
              if grep -qx "$unwanted" "$listing"; then
                echo "$a contains $unwanted, which must never be published"; exit 1
              fi
            done
            if grep -qv '^opendrive-bridge/' "$listing"; then
              echo "$a has files outside opendrive-bridge/:"; cat "$listing"; exit 1
            fi
            for want in opendrive-bridge/opendrived opendrive-bridge/odctl \
                        opendrive-bridge/.env.example \
                        opendrive-bridge/docs/first-run.md opendrive-bridge/docs/deployment.md; do
              grep -q "^$want" "$listing" \
                || { echo "$a is missing $want; it contains:"; cat "$listing"; exit 1; }
            done
            rm -f "$listing"
          done
          echo "$want_archives archives, checksums present, contents complete"
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-archives
          path: |
            dist/*.tar.gz
            dist/*SHA256SUMS
          retention-days: 7

  # The container image, built for both architectures and then actually run.
  #
  # The interesting assertions are the container-specific ones: a container has
  # no keychain, so the "no persistence = configuration error" gate is the first
  # thing a user meets, and what it says has to be a sentence naming the variable
  # to set — not a stack trace (§9.2, §8.3).
  docker:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with: { platforms: arm64 }
      - uses: docker/setup-buildx-action@v3

      - name: Build both architectures
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=ci-${{ github.sha }}
            COMMIT=${{ github.sha }}

      - name: Load the native image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: opendrive-bridge:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
            COMMIT=${{ github.sha }}

      # Scanned here as well as before publication, for the reason this project
      # has now met four times: a gate that only runs at release time turns every
      # slow-moving problem into a surprise on the day you want to ship. This one
      # found twelve HIGH findings in the Go standard library compiled into the
      # image, because the Dockerfile's builder had been left on an old Go while
      # everything else moved on. Nothing in the code was wrong and no test could
      # have said so.
      - name: trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: opendrive-bridge:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      # Same rule for the image: the credential files are created by the user
      # at run time and mounted in, never baked in.
      - name: The image carries no credential files
        run: |
          set -euo pipefail
          found=$(docker run --rm --entrypoint /usr/local/bin/odctl opendrive-bridge:ci --version >/dev/null 2>&1 && echo ok)
          [ "$found" = "ok" ] || { echo "the image does not run"; exit 1; }
          # distroless has no shell, so the filesystem is inspected from outside.
          id=$(docker create opendrive-bridge:ci)
          docker export "$id" | tar t 2>/dev/null | grep -E '(^|/)\.env(\.key)?$' && {
            docker rm "$id" >/dev/null; echo "the image contains a credential file"; exit 1; }
          docker rm "$id" >/dev/null
          echo "no .env or .env.key in the image"

      - name: The image is small enough to be worth shipping
        run: |
          set -euo pipefail
          bytes=$(docker image inspect opendrive-bridge:ci --format '{{.Size}}')
          mb=$((bytes / 1024 / 1024))
          echo "image is ${mb}MB"
          # §8.3 asks for under 25MB. Two static Go binaries and a CA bundle.
          [ "$mb" -lt 25 ] || { echo "over the 25MB budget in §8.3"; exit 1; }

      - name: It runs as a non-root user
        run: |
          set -euo pipefail
          user=$(docker image inspect opendrive-bridge:ci --format '{{.Config.User}}')
          echo "runs as: $user"
          case "$user" in root|"") echo "the image runs as root"; exit 1 ;; esac

      # Every `docker run` that is not -d gets a `timeout`, without exception.
      #
      # This is not belt-and-braces. The step below used to assert that a
      # container with no ODB_STATE_KEY refused to start, which was true until
      # v1.1 moved credentials to an encrypted .env the daemon creates itself.
      # After that the container started normally — and a foreground `docker run`
      # of a daemon that starts does not fail, it blocks. The job ran for six
      # hours and was killed by the platform, twice, and the only symptom was a
      # red tick with no message in it. An assertion whose premise has been
      # deleted should fail in seconds; `timeout` is what makes the difference
      # between a wrong answer and no answer at all.
      - name: A credential directory it cannot write to is a sentence, not a hang
        run: |
          set -euo pipefail
          # This is the v1.1 shape of "no persistence = configuration error"
          # (§9.2.4). There is no state key to forget any more: the daemon makes
          # .env.key itself on first run. What it cannot do is make it in a
          # read-only mount, and mounting /data read-only is an easy thing to do
          # by accident — it is what you would try if you had read that .env
          # holds secrets.
          mkdir -p /tmp/ro && chmod 0777 /tmp/ro
          set +e
          out=$(timeout 60 docker run --rm -v /tmp/ro:/data:ro opendrive-bridge:ci 2>&1)
          code=$?
          set -e
          echo "exit=$code"; echo "$out"

          [ "$code" -ne 124 ] || { echo "it hung instead of answering"; exit 1; }
          [ "$code" -ne 0 ] || { echo "it started with nowhere to keep credentials"; exit 1; }
          # The message has to name the files the user is dealing with, and the
          # directory to fix. It used to name the atomic-write temp file instead.
          echo "$out" | grep -q "\.env\.key" || { echo "the message does not name .env.key"; exit 1; }
          echo "$out" | grep -q "/data" || { echo "the message does not name the directory"; exit 1; }
          echo "$out" | grep -q "\.tmp" && { echo "the message names a temp file"; exit 1; }
          # ...and must not be a crash.
          echo "$out" | grep -qiE "panic|goroutine [0-9]+|\.go:[0-9]+" \
            && { echo "a stack trace reached the user"; exit 1; }
          echo "refused correctly, with something a person can act on"

      - name: A public address with no API key of the user's own is refused
        run: |
          set -euo pipefail
          # The image binds 0.0.0.0 because loopback inside a container means
          # unreachable, so this is every container user's situation. The daemon
          # generates an API key into .env on first run, and that key must not be
          # what opens the port: nothing prints it, §9.4 forbids logging it, and
          # a service answering only to a secret its owner has never seen is not
          # a service they can use. Exposing the bridge has to be deliberate.
          set +e
          out=$(timeout 60 docker run --rm opendrive-bridge:ci 2>&1)
          code=$?
          set -e
          echo "exit=$code"; echo "$out"
          [ "$code" -ne 124 ] || { echo "it hung instead of refusing"; exit 1; }
          [ "$code" -ne 0 ] || { echo "it exposed the account on 0.0.0.0 with no API key"; exit 1; }
          echo "$out" | grep -qi "api key" || { echo "the refusal does not mention an API key"; exit 1; }
          echo "$out" | grep -q "ODB_API_KEY" || { echo "the refusal does not say how to set one"; exit 1; }

      - name: Configured properly, it starts and answers
        run: |
          set -euo pipefail
          # The credential path is the host's, exactly as §8.3 and the compose
          # file describe it: a writable /data for .env, and the key supplied by
          # the environment. ODB_STATE_KEY stands in for .env.key and is the one
          # container-specific convenience there is.
          docker run -d --name odb-ci \
            -p 127.0.0.1:9750:9750 \
            -e ODB_STATE_KEY="$(openssl rand -base64 32)" \
            -e ODB_API_KEY=ci-key \
            opendrive-bridge:ci
          for _ in $(seq 1 40); do
            curl -fsS -H 'Authorization: Bearer ci-key' \
              http://127.0.0.1:9750/v1/auth/status >/tmp/status.json && break
            sleep 0.5
          done
          cat /tmp/status.json
          # Not signed in is the right answer for a fresh container, and it must
          # come with the credential store it actually chose.
          grep -q '"state":"not_configured"' /tmp/status.json
          grep -q '"backend":"encrypted_file"' /tmp/status.json
          echo "the container answers, using the encrypted-file store"

      - name: The healthcheck reports healthy
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            health=$(docker inspect odb-ci --format '{{.State.Health.Status}}')
            echo "health: $health"
            [ "$health" = "healthy" ] && exit 0
            [ "$health" = "unhealthy" ] && { docker logs odb-ci; exit 1; }
            sleep 2
          done
          docker logs odb-ci
          echo "the healthcheck never settled"
          exit 1

      - name: Logs, for the record
        if: always()
        run: docker logs odb-ci 2>&1 | tail -20 || true
