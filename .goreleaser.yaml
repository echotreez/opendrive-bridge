# Release build for opendrive-bridge (whitepaper §8.1).
#
# Three platforms, two binaries, one checksum file. The version comes from the
# git tag rather than from a constant in the source, so `opendrived --version`
# and the tag are the same string by construction — a binary can always be
# traced back to the commit it was built from.
#
# v1.1 dropped darwin/amd64 and windows/arm64 from the *release matrix* only,
# leaving them cross-compiling and covered by CI. v1.2 removes Windows
# altogether, and that is a different kind of removal: it is the only platform
# that needed a parallel implementation of things the others share — an icacls
# ACL for the credential file because NTFS ignores the mode bits, a Windows
# Service instead of a user-level systemd or launchd unit, zip instead of
# tar.gz, Authenticode instead of codesign — and the caching gateway of §3.5
# adds another set of path and file-locking differences on top. §8.1 has the
# reasoning. The code still cross-compiles to Windows; it is simply not built,
# not tested and not claimed to work, and restoring it means restoring the CI
# coverage first.
version: 2

project_name: opendrive-bridge

before:
  hooks:
    # A release must not be the first place a problem shows up.
    - go mod tidy
    - go test ./...

builds:
  - id: opendrived
    main: ./cmd/opendrived
    binary: opendrived
    # No cgo anywhere. Since v1.1 credentials are an encrypted file and nothing
    # else, so there is no vault to link against and these cross-compile with
    # the toolchain alone (§8.1).
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    # darwin/amd64 is the one remaining exclusion: Intel Macs, few enough of them
    # to be worth one fewer archive. linux/arm64 stays because that is a Pi or a
    # cheap VPS, which is exactly where a bridge like this ends up living.
    ignore:
      - { goos: darwin, goarch: amd64 }
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.FullCommit}}
      - -X main.buildDate={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: odctl
    main: ./cmd/odctl
    binary: odctl
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    # darwin/amd64 is the one remaining exclusion: Intel Macs, few enough of them
    # to be worth one fewer archive. linux/arm64 stays because that is a Pi or a
    # cheap VPS, which is exactly where a bridge like this ends up living.
    ignore:
      - { goos: darwin, goarch: amd64 }
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.FullCommit}}
      - -X main.buildDate={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  # Both binaries travel together: odctl without a daemon is half a tool, and a
  # daemon with no way to log in is none.
  - id: default
    ids: [opendrived, odctl]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Unpacking must create opendrive-bridge/ and put everything inside it.
    # Without this the archive is a tar bomb: `tar xzf` scatters two binaries,
    # LICENSE, README, docs/ and deploy/ across whatever directory the user
    # happened to be in, and they have to pick them out by hand to undo it.
    # Found by unpacking a real release rather than by reading the config.
    #
    # It also matters more now than it would have before: the programs run from
    # the directory they were unpacked into, and .env lives beside them (§8.2),
    # so "the folder" is a real thing a user keeps and backs up.
    wrap_in_directory: opendrive-bridge
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      # The template, never a real .env: deployment starts with copying this.
      - .env.example
      # The first thing someone unpacking this needs is not the deployment
      # guide, it is the five minutes that ends with a file in their account.
      - src: docs/first-run.md
        dst: docs/first-run.md
      - src: docs/deployment.md
        dst: docs/deployment.md
      - src: docs/bridge-openapi.yaml
        dst: docs/bridge-openapi.yaml
      - src: deploy/**/*
        dst: deploy

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: git
  sort: asc
  # Without this every line of the release notes begins with a 40-character
  # commit hash, which is the least useful part of the line and pushes the
  # subject — the part someone is reading the notes for — off to the right.
  # -1 removes it; the commit is one click away in the compare view anyway.
  abbrev: -1
  filters:
    exclude:
      - "^chore"
      - "^ci"
      - "^style"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Documentation
      regexp: '^docs(\(.+\))?!?:'
      order: 2
    - title: Tests and internals
      regexp: '^(test|refactor|perf)(\(.+\))?!?:'
      order: 3

release:
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
  header: |
    ## opendrive-bridge {{ .Tag }}

    A local REST API and command line for OpenDrive.com.

    Unpack it, start the daemon, then:

    ```
    cp .env.example .env      # then fill in your OpenDrive username and password
    ./opendrived              # once: this encrypts .env and creates .env.key
    ./odctl ls /
    ./odctl up ./report.pdf /Documents/report.pdf
    ```

    **On macOS, clear the quarantine flag first** — see below, it is the first
    thing that stops people.

    `docs/first-run.md` inside the archive is the five-minute version with a
    section for each platform and one for Docker. `docs/deployment.md` covers
    running it as a background service and which credential store to use where.
  footer: |
    ### Checking what you downloaded

    ```
    sha256sum --check --ignore-missing {{ .ProjectName }}_{{ .Version }}_SHA256SUMS
    ```

    ### macOS

    These builds are signed only when a certificate was available. If macOS
    refuses to run them, `docs/deployment.md` explains why and what to do —
    the short version is `xattr -d com.apple.quarantine ./opendrived ./odctl`.

    ### Container

    ```
    docker pull ghcr.io/echotreez/opendrive-bridge:{{ .Tag }}
    ```

    The container takes the same two files as a host install: mount `.env`
    writable and `.env.key` read-only. Neither is in the image.
