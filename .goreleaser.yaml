# Release build for opendrive-bridge (whitepaper §8.1).
#
# Three platforms, two binaries, one checksum file. The version comes from the
# git tag rather than from a constant in the source, so `opendrived --version`
# and the tag are the same string by construction — a binary can always be
# traced back to the commit it was built from.
#
# Intel Macs (darwin/amd64) are not supported: not released, not built, not
# smoked. Windows is not supported either, and for a different reason: it is the
# only platform
# that needed a parallel implementation of things the others share — an icacls
# ACL for the credential file because NTFS ignores the mode bits, a Windows
# Service instead of a user-level systemd or launchd unit, zip instead of
# tar.gz, Authenticode instead of codesign — and the caching gateway of §3.5
# adds another set of path and file-locking differences on top. §8.1 has the
# reasoning. The code still cross-compiles to Windows; it is simply not built,
# not tested and not claimed to work, and restoring it means restoring the CI
# coverage first.
version: 2

project_name: opendrive-bridge

before:
  hooks:
    # A release must not be the first place a problem shows up.
    - go mod tidy
    - go test ./...

builds:
  - id: opendrived
    main: ./cmd/opendrived
    binary: opendrived
    # No cgo anywhere. Since v1.1 credentials are an encrypted file and nothing
    # else, so there is no vault to link against and these cross-compile with
    # the toolchain alone (§8.1).
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    # darwin/amd64 is excluded: Intel Macs are not supported (§8.1). linux/arm64
    # stays because that is a Pi or a cheap VPS, which is exactly where a bridge
    # like this ends up living.
    ignore:
      - { goos: darwin, goarch: amd64 }
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.FullCommit}}
      - -X main.buildDate={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: odctl
    main: ./cmd/odctl
    binary: odctl
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    # darwin/amd64 is excluded: Intel Macs are not supported (§8.1). linux/arm64
    # stays because that is a Pi or a cheap VPS, which is exactly where a bridge
    # like this ends up living.
    ignore:
      - { goos: darwin, goarch: amd64 }
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.FullCommit}}
      - -X main.buildDate={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  # Both binaries travel together: odctl without a daemon is half a tool, and a
  # daemon with no way to log in is none.
  - id: default
    ids: [opendrived, odctl]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Unpacking must create opendrive-bridge/ and put everything inside it.
    # Without this the archive is a tar bomb: `tar xzf` scatters two binaries,
    # LICENSE, README, docs/ and deploy/ across whatever directory the user
    # happened to be in, and they have to pick them out by hand to undo it.
    # Found by unpacking a real release rather than by reading the config.
    #
    # It also matters more now than it would have before: the programs run from
    # the directory they were unpacked into, and credentials.key is written beside
    # them (§8.2), so "the folder" is a real thing a user keeps and backs up.
    wrap_in_directory: opendrive-bridge
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      # The first thing someone unpacking this needs is not the deployment
      # guide, it is the five minutes that ends with a file in their account.
      - src: docs/first-run.md
        dst: docs/first-run.md
      - src: docs/deployment.md
        dst: docs/deployment.md
      - src: docs/bridge-openapi.yaml
        dst: docs/bridge-openapi.yaml
      - src: deploy/**/*
        dst: deploy

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  # The first release (and its first candidate) has no earlier version to be
  # compared with; the release workflow sets ODB_FIRST_RELEASE, and the header
  # carries the introduction instead.
  disable: '{{ isEnvSet "ODB_FIRST_RELEASE" }}'
  use: git
  sort: asc
  # Without this every line of the release notes begins with a 40-character
  # commit hash, which is the least useful part of the line and pushes the
  # subject — the part someone is reading the notes for — off to the right.
  # -1 removes it; the commit is one click away in the compare view anyway.
  abbrev: -1
  filters:
    exclude:
      - "^chore"
      - "^ci"
      - "^style"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Documentation
      regexp: '^docs(\(.+\))?!?:'
      order: 2
    - title: Tests and internals
      regexp: '^(test|refactor|perf)(\(.+\))?!?:'
      order: 3

release:
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
  header: |
    ## opendrive-bridge {{ .Tag }}

    A local REST API, command line and web page for OpenDrive.com.

    Unpack it and start it — there is nothing to set up first:

    ```
    ./opendrived
    ```

    Then open `http://127.0.0.1:9750/ui` and sign in with your OpenDrive account,
    or in another terminal:

    ```
    ./odctl login you@example.com
    ./odctl ls /
    ./odctl up ./report.pdf /Documents/report.pdf
    ```

    **On macOS, clear the quarantine flag first** — see below, it is the first
    thing that stops people.

    `docs/first-run.md` inside the archive is the five-minute version, with a
    section for each platform, one for Docker and one for the cache.

    ### What it does

    - **No setup step.** The bridge starts with nothing prepared and asks you to
      sign in — on the web page or with `odctl login`. It encrypts what you typed
      into one file, `credentials.key`, beside the programs, and keeps itself
      signed in across restarts. If your OpenDrive password changes, the page asks
      you to sign in again; nothing needs restarting.
    - **Docker is `docker compose up -d`**, then sign in. No files to create, no
      folders to prepare, no `chown`, no key to generate; everything the bridge
      keeps is in `./data`.
    - **A local cache, off on a host unless you turn it on** (on in the compose
      file). It serves files you have read before from your own disk, and can
      accept an upload before it reaches OpenDrive. Read the cache section of
      `docs/first-run.md` before relying on it: `odctl cache status` is how you
      tell whether everything has actually reached OpenDrive.
    - **A web page** at `/ui`: the account, sign-in, transfers and the cache.
    - **The API key is optional.** Set `ODB_API_KEY` and every caller must send it;
      leave it unset and the API answers whatever can reach the port — loopback
      by default, and `127.0.0.1` in the compose file.

    ### Good to know

    - `credentials.key` is encrypted with a key kept in the same file. That keeps
      your password out of casual view, out of git and out of a backup's plain
      text; it does not protect it from someone who can already read your files.
    - macOS on Apple silicon and Linux (x86-64, ARM64). On Windows, run the
      container.

  footer: |
    ### Checking what you downloaded

    ```
    sha256sum --check --ignore-missing {{ .ProjectName }}_{{ .Version }}_SHA256SUMS
    ```

    ### macOS

    These builds are signed only when a certificate was available. If macOS
    refuses to run them, `docs/deployment.md` explains why and what to do —
    the short version is `xattr -d com.apple.quarantine ./opendrived ./odctl`.

    ### Container

    ```
    docker pull ghcr.io/echotreez/opendrive-bridge:{{ .Tag }}
    ```

    `docker compose up -d` with `deploy/docker/docker-compose.yaml`, then sign in at
    `http://127.0.0.1:9750/ui`. Everything the bridge keeps is in `./data`;
    nothing is in the image.
